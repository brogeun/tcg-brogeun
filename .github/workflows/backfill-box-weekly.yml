name: Update All Box Volume (Daily)

# The single 04:17 KST daily cycle calls this collector; manual runs remain available.
# 월~토: 최근 14일을 겹쳐 수집, 일요일: 최근 90일 재검증.
# The parent plans the 14/90-day window from the actual Korean day.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: recent
      days:
        type: string
        default: '14'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 범위'
        required: true
        default: recent
        type: choice
        options:
          - recent
          - full
      days:
        description: 'recent 모드 재수집 일수'
        required: true
        default: '14'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 박스 수 × 페이지네이션 — 최대 3시간
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Record the actual source after history rotation
        run: echo "COLLECTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify card histories are excluded from box updates
        run: python -B -m unittest discover -s scripts -p 'test_backfill_box_*.py'

      - name: Update every box volume
        id: collect
        continue-on-error: true  # Preserve completed products, then truthfully report any failed source.
        shell: bash
        run: |
          run_four_shards() {
            local extra_args=("$@")
            pids=()
            for batch in 0 1 2 3; do
              python scripts/backfill_box_history.py --batch "$batch" --of 4 "${extra_args[@]}" &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            return "$failed"
          }

          if [[ "$BOX_MODE" == "full" ]]; then
            echo "Manual full reconciliation"
            run_four_shards
          else
            DAYS="${BOX_DAYS:-14}"
            [[ "$DAYS" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid box day count'; exit 1; }
            RANGE=oneMonth
            if (( DAYS > 30 )); then RANGE=threeMonths; fi
            echo "Reconciliation: ${DAYS} days"
            run_four_shards --days "$DAYS" --range "$RANGE"
          fi
        env:
          PYTHONUNBUFFERED: "1"
          BOX_MODE: ${{ inputs.mode }}
          BOX_DAYS: ${{ inputs.days }}

      - name: Audit all box history files
        if: always() && !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: python scripts/audit_box_history.py
        env:
          PYTHONIOENCODING: "utf-8"

      - name: Publish completed box histories without overwriting concurrent edits
        if: always() && !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          python -B - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish_data_snapshot import PublicationError, daily_files, publish
          root = Path.cwd().resolve()
          base = os.environ['COLLECTION_COMMIT']
          files = daily_files(root, base)
          if any(not re.fullmatch(r'data/history/[1-9][0-9]{0,19}\.json', name) for name in files):
              raise PublicationError('Box collection may publish only generated history JSON')
          print(json.dumps(publish(root, base, files,
              'data: refresh completed box volume targets', daily=True)))
          PY

      - name: Report incomplete box sources after retaining valid products
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo '::error::Box source collection was incomplete; failed products retained their prior histories.'
          exit 1
