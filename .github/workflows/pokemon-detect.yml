name: Pokemon New Set Auto-Sync

# 매주 월요일 오전 9시 KST — 신규 세트 감지 + 자동 fetch + commit + deploy
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 imagehash pillow

      - name: Detect & sync new Pokemon sets
        id: sync
        run: |
          python scripts/sync_pokemon.py 2>&1 | tee sync_output.txt
          if grep -q "🆕 신규 후보\|✓ 신규 세트 fetch" sync_output.txt; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Build card-to-box reverse map (Pokemon 신규 반영)
        if: steps.sync.outputs.has_new == 'true'
        run: python scripts/build_card_to_box.py

      - name: Check changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards-by-set/ data/card-to-box.json images/sets/ index.html 2>/dev/null || true
          git commit -m "🤖 Pokemon 신규 세트 자동 동기화"
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy . --project-name=tcghubrogeun --commit-dirty=true --branch=main

      - name: Create issue if sync failed
        if: failure() && steps.sync.outputs.has_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('sync_output.txt', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Pokemon 자동 동기화 실패 (${today})`,
              body: `자동 fetch 또는 commit 실패. 로그:\n\n\`\`\`\n${output.slice(0, 5000)}\n\`\`\``,
              labels: ['auto-detect', 'failed'],
            });
