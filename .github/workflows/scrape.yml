name: Read-only centering runtime audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Compare immutable old and current runtime metadata using GET only
        run: |
          python - <<'PY'
          import hashlib,json,os,re,urllib.request
          ACCOUNT=os.environ['CF_ACCOUNT_ID']
          assert re.fullmatch(r'[0-9a-f]{32}',ACCOUNT),'Unexpected existing account identifier'
          BASE='https://api.cloudflare.com/client/v4/accounts/'+ACCOUNT+'/pages/projects/tcghubrogeun'
          OLD='9b04d990-c6d5-469f-9b99-fc8d86c265ff'
          OLD_COMMIT='582d5cc355d55395485e9c93b39bc813337adc6f'
          NEW_COMMIT='a43cb7cc9288a7a619e119829ecd1d07b88e78a5'
          META={'id','short_id','url','aliases','created_on','modified_on','latest_stage','stages',
                'deployment_trigger','build_config','source','is_skipped','project_id','project_name',
                'build_image_major_version','production_script_name','preview_script_name','environment'}
          CORE=('env_vars','kv_namespaces','d1_databases','r2_buckets','ai_bindings','compatibility_date','compatibility_flags','usage_model')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def get(suffix):
              assert suffix=='' or re.fullmatch(r'/deployments/[0-9a-f-]{36}',suffix),'Unexpected metadata path'
              req=urllib.request.Request(BASE+suffix,method='GET',headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN'],'Accept':'application/json'})
              with opener.open(req,timeout=30) as response:
                  raw=response.read(2*1024*1024+1)
              assert len(raw)<=2*1024*1024,'Metadata response too large'
              result=json.loads(raw)
              assert result.get('success') is True,'Existing runtime metadata query failed'
              return result['result']
          def digest(value):
              return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          def commit(deployment): return deployment.get('deployment_trigger',{}).get('metadata',{}).get('commit_hash')
          project=get('')
          old=get('/deployments/'+OLD)
          new_id=project['canonical_deployment']['id']
          new=get('/deployments/'+new_id)
          assert old['id']==OLD and commit(old)==OLD_COMMIT,'Immutable old baseline differs'
          assert commit(new)==NEW_COMMIT,'Canonical source changed; stop rather than comparing the wrong deployment'
          assert old['environment']==new['environment']=='production','Wrong deployment environment'
          keys=sorted((set(old)|set(new))-META)
          comparison={key:{'before':digest(old.get(key)),'after':digest(new.get(key)),'equal':old.get(key)==new.get(key)} for key in keys}
          core={key:{'before':digest(old.get(key)),'after':digest(new.get(key)),'equal':old.get(key)==new.get(key)} for key in CORE}
          production=project['deployment_configs']['production']
          report={'status':'comparison-complete','oldDeploymentId':OLD,'newDeploymentId':new_id,'oldCommit':commit(old),'newCommit':commit(new),
                  'originalFailedWorkflowId':40199660666,'core8':core,'guardComparedFields':comparison,
                  'guardDifferingKeys':[key for key in keys if not comparison[key]['equal']],
                  'allDifferingTopLevelKeys':[key for key in sorted(set(old)|set(new)) if old.get(key)!=new.get(key)],
                  'currentProductionKeys':sorted(production), 'currentProductionSHA256':digest(production),
                  'productionSecretNamesPresent':{'OPENAI_API_KEY':'OPENAI_API_KEY' in production.get('env_vars',{}),'JWT_SECRET':'JWT_SECRET' in production.get('env_vars',{})},
                  'productionDbBindingPresent':'DB' in production.get('d1_databases',{}),
                  'noCloudflareWrites':True,'actualAIRequests':0,'rawSettingsOrSecretsPrinted':False}
          print('RUNTIME_AUDIT_JSON='+json.dumps(report,sort_keys=True,separators=(',',':')))
          PY
