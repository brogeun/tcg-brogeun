name: Verify box and set artwork

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/english-catalog.*'
      - 'assets/japanese-catalog.js'
      - 'assets/japanese-set-artwork.js'
      - 'assets/app-route-loader.js'
      - 'config/*set-image*'
      - 'config/pokemon-tcg-english-sets.json'
      - 'config/japanese-packaging-images.json'
      - 'data/english-set-images.json'
      - 'scripts/*set*images*'
      - 'scripts/*set*artwork*'
      - 'scripts/retailer_card_printings.py'
      - 'scripts/test_retailer_printing_covers.py'
      - 'scripts/materialize_vintage_pokemon_release.py'
      - 'scripts/test_materialize_vintage_pokemon_release.py'
      - 'scripts/collect_vintage_rarity.py'
      - 'scripts/test_collect_vintage_rarity.py'
      - 'scripts/test_vintage_rarity_overlay.cjs'
      - 'data/collections/sources/pokemon-jp-rarity-metadata.json'
      - 'data/collections/sources/pokemon-rarity-recheck/part-7100.json'
      - 'scripts/test_vintage_resume.py'
      - 'scripts/run_vintage_backfill.py'
      - 'scripts/test_run_vintage_backfill.py'
      - 'TCGHUB_Vintage_Backfill.cmd'
      - '.github/workflows/box-artwork-ci.yml'

permissions:
  contents: read

concurrency:
  group: box-artwork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /index.html
            /assets/
            /scripts/
            /config/
            /data/english-catalog.json
            /data/english-set-images.json
            /data/us-market/
            /data/cards-by-set/Neo1.json
            /data/cards-by-set/Neo2.json
            /data/cards-by-set/Neo3.json
            /data/cards-by-set/Neo4.json
            /data/collections/sources/pokemon-jp-rarity-metadata.json
            /data/collections/sources/pokemon-rarity-recheck/part-7100.json
            /images/box/
            /images/box2/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned image verifier
        run: python -m pip install "Pillow==12.2.0"
      - name: Verify provenance, exact identities and source request pacing
        run: |
          node --test scripts/test_english_set_images.cjs scripts/test_japanese_set_artwork.cjs scripts/test_set_artwork_release.cjs
          python -B -m unittest discover -s scripts -p test_retailer_printing_covers.py
          python -B -m unittest discover -s scripts -p test_materialize_vintage_pokemon_release.py
          python -B -m unittest discover -s scripts -p test_collect_vintage_rarity.py
          node --test scripts/test_vintage_rarity_overlay.cjs
          python -B -m unittest discover -s scripts -p test_vintage_resume.py
          python -B -m unittest discover -s scripts -p test_run_vintage_backfill.py

  windows-backfill:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /TCGHUB_Vintage_Backfill.cmd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned image verifier
        run: python -m pip install "Pillow==12.2.0"
      - name: Verify resume, interruption and the real CMD launcher
        env:
          PYTHONUTF8: '1'
        run: |
          python -B -m unittest discover -s scripts -p test_vintage_resume.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts -p test_run_vintage_backfill.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
