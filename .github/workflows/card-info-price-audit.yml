name: Card information price audit
on:
  push:
    branches: ['fix/card-info-price-audit']
    paths-ignore: ['audit/card-info-price/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-info-price-audit
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/
            /scripts/
            /functions/
            /data/*.json
            /data/cards-by-set/
            /data/tcg-card-info/
            /data/yuyutei-market/
            /data/english-sets/EN-TCG11803.json
            /index.html
            /sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all reviewed artwork, details, price priorities and source failures
        run: |
          node --test scripts/test_op17_contained_prices.cjs scripts/test_op16_contained_prices.cjs scripts/test_card_price_fallback.cjs scripts/test_contained_card_prices.cjs scripts/test_tcg_card_info.cjs scripts/test_card_info_pricing_integration.cjs scripts/test_contained_artwork_bindings.cjs scripts/test_contained_artwork_data.cjs scripts/test_contained_detail_lookup.cjs scripts/audit/card-grades-source.test.mjs scripts/audit/grade-availability.test.mjs
          node scripts/test_english_catalog.cjs
          node scripts/test_fx_display.cjs
          node scripts/test_card_info_quote_coverage.cjs
          node --check scripts/verify_card_info_prices_production.cjs
