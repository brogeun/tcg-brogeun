name: PSA Pop Daily Gamble

# 매일 KST 05:00 (UTC 20:00) — Cloudflare 도박. 통과하는 카드만 누적.
# PSA Pop 기능 사용자 결정으로 보류 — 추후 유저 데이터 누적 방식으로 재설계 예정
on:
  # schedule:
  #   - cron: '0 20 * * *'
  workflow_dispatch:  # 수동 실행만 (cron 비활성화)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install deps
        run: pip install selenium

      - name: Try PSA Pop scrape (gamble)
        run: python scripts/scrape_psa_pop.py --limit 50 || true

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/psa-pop.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/psa-pop.json
            git commit -m "🎲 PSA Pop daily gamble update"
            git push
          else
            echo "No changes — Cloudflare blocked or all cached."
          fi

      - name: Deploy to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy . --project-name=tcghubrogeun --commit-dirty=true --branch=main
