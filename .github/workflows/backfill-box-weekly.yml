name: Update All Box Volume (Daily)

# 매일 02:00 KST 전 박스 거래량 갱신.
# 월~토: 최근 14일을 겹쳐 수집, 일요일: 최근 90일 재검증.
# UTC 기준 일요일~금요일은 KST 월요일~토요일이다.

on:
  schedule:
    - cron: '0 17 * * 0-5'  # 월~토 02:00 KST — 최근 14일
    - cron: '0 17 * * 6'    # 일요일 02:00 KST — 최근 90일
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 범위'
        required: true
        default: recent
        type: choice
        options:
          - recent
          - full
      days:
        description: 'recent 모드 재수집 일수'
        required: true
        default: '14'

permissions:
  contents: write

concurrency:
  group: backfill-box
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 박스 수 × 페이지네이션 — 최대 3시간
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update every box volume
        shell: bash
        run: |
          run_four_shards() {
            local extra_args=("$@")
            pids=()
            for batch in 0 1 2 3; do
              python scripts/backfill_box_history.py --batch "$batch" --of 4 "${extra_args[@]}" &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            return "$failed"
          }

          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 17 * * 6" ]]; then
            echo "Sunday 90-day reconciliation"
            run_four_shards --days 90 --range threeMonths
          elif [[ "${{ inputs.mode }}" == "full" ]]; then
            echo "Manual full reconciliation"
            run_four_shards
          else
            DAYS="${{ inputs.days }}"
            DAYS="${DAYS:-14}"
            echo "Daily recent reconciliation: ${DAYS} days"
            run_four_shards --days "${DAYS}" --range oneMonth
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Audit all box history files
        run: python scripts/audit_box_history.py
        env:
          PYTHONIOENCODING: "utf-8"

      - name: Commit history updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily all-box volume update"
          file_pattern: "data/history/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
