name: Card information price audit
on:
  push:
    branches: ['fix/card-info-price-audit']
    paths-ignore: ['audit/card-info-price/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: card-info-price-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-info-price-audit
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/
            /scripts/
            /data/*.json
            /data/cards-by-set/
            /data/tcg-card-info/
            /data/yuyutei-market/
            /data/english-sets/EN-TCG11803.json
            /images/onepiece/
            /index.html
            /sw.js
            /.github/workflows/
            /audit/card-info-price/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all price source, artwork, FX and OP17 regressions
        run: |
          node --test scripts/test_op17_contained_prices.cjs scripts/test_card_price_fallback.cjs scripts/test_contained_card_prices.cjs scripts/test_tcg_card_info.cjs scripts/test_card_info_pricing_integration.cjs scripts/test_contained_artwork_bindings.cjs scripts/test_contained_artwork_data.cjs
          node scripts/test_english_catalog.cjs
      - name: Audit every stored Japanese printing after repairs
        run: node scripts/audit_card_info_price_links.cjs .cache/price-link-audit/after
      - name: Audit additional games without dropping known source prices
        run: node scripts/test_card_info_quote_coverage.cjs
      - name: Probe exact Japanese prices missing from overseas catalogue
        run: node scripts/probe_missing_snkr_prices.cjs
      - uses: actions/cache/restore@v4
        with:
          path: .cache/price-link-audit/image-hashes.jsonl
          key: card-price-artwork-v1-41035877629
      - name: Prepare remaining OP16 artwork comparisons for review
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/create_card_price_audit_preview.py
      - name: Save reviewed audit evidence
        if: always()
        run: |
          if [ -f .cache/price-link-audit/after/summary.json ]; then cp .cache/price-link-audit/after/summary.json audit/card-info-price/after.json; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/card-info-price
          if ! git diff --cached --quiet; then git commit -m "Save complete price-link repair verification"; git push origin HEAD:fix/card-info-price-audit; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-info-price-audit
          path: audit/card-info-price
