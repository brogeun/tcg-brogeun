name: KREAM Local Checks

on:
  pull_request:
    paths:
      - 'scripts/*kream*'
      - '.github/workflows/kream*.yml'
      - '.github/workflows/scrape.yml'
      - 'docs/kream-promos-operations.md'

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/
            /data/korean-promos/
            /data/korean-promos.json
            /data/korean-promos-health.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows timezone database
        run: python -m pip install tzdata
      - name: Validate original data and local collection boundaries
        run: |
          python -m unittest scripts.test_kream_promos scripts.test_setup_kream_session scripts.test_kream_session_storage scripts.test_run_kream_local scripts.test_import_kream_local
          python scripts/collect_kream_promos.py --validate-only
      - name: Verify installer on Windows PowerShell 5.1 without changing tasks
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test_install_kream_local.ps1
      - name: Verify installer on PowerShell 7 without changing tasks
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test_install_kream_local.ps1
