name: Verify card pricing integration

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_price_box_names.mjs'
      - 'scripts/build_search_snapshot.cjs'
      - 'scripts/test_search_snapshot.cjs'
      - 'data/manual-boxes-*.json'
      - 'data/price-*.json'
      - 'data/cards-meta-index.json'
      - 'sw.js'
      - 'assets/**'
      - 'scripts/helpers/**'
      - 'scripts/test_card_info_pricing_integration.cjs'
      - 'scripts/test_verify_card_info_prices.cjs'
      - 'scripts/verify_card_info_prices_production.cjs'
      - 'scripts/test_futuristic_market.mjs'
      - 'scripts/sync_futuristic_market.py'
      - 'scripts/backfill_history.py'
      - 'data/all-cards.json'
      - 'data/card-catalog-repairs.json'
      - 'data/contained-card-market-links.json'
      - 'data/onepiece-card-overrides.json'
      - 'data/futuristic-market.json'
      - 'data/anniversary-market.json'
      - 'data/history/881432.json'
      - 'data/history/881433.json'
      - 'data/history/897035.json'
      - 'data/history/897036.json'
      - 'data/cards-by-set/**'
      - '.github/workflows/pricing-integration-ci.yml'
      - '.github/workflows/scrape.yml'
      - '.github/workflows/market-references-daily.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /data/price-box-name-overrides.json
            /data/cards-meta-index.json
            /data/manual-boxes-pokemon.json
            /data/manual-boxes-onepiece.json
            /data/price-pokemon-box.json
            /data/price-onepiece-box.json
            /data/price-pokemon-card.json
            /data/price-onepiece-card.json
            /sw.js
            /assets/
            /scripts/
            /data/all-cards.json
            /data/card-catalog-repairs.json
            /data/contained-card-market-links.json
            /data/onepiece-card-overrides.json
            /data/futuristic-market.json
            /data/anniversary-market.json
            /data/history/881432.json
            /data/history/881433.json
            /data/history/897035.json
            /data/history/897036.json
            /data/cards-by-set/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check card clicks and exact deployed asset URLs
        run: |
          node --test --test-concurrency=1 scripts/test_card_info_pricing_integration.cjs
          node --test --test-concurrency=1 scripts/test_verify_card_info_prices.cjs
          node scripts/test_futuristic_market.mjs
          node scripts/test_price_box_names.mjs
          node --test --test-concurrency=1 scripts/test_search_snapshot.cjs
