name: Verify deployed One Piece artwork and fallback
on:
  push:
    branches: ['onepiece/production-check-20261101']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/
            /scripts/onepiece_audit/verify_production.cjs
            /data/onepiece-market-link-audit-20261101.json
            /data/onepiece-reviewed-promo-links.json
            /config/onepiece-mercari-artwork-reviews-20261101.json
            /sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public identities, runtime, real promo references and KRW display
        run: node scripts/onepiece_audit/verify_production.cjs
      - name: Upload reviewed public-release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onepiece-production-verification
          path: .cache/onepiece-production-check.json
          if-no-files-found: warn
