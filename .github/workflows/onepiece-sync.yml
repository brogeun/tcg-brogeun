name: OnePiece Card Sync

# Single daily cycle: Monday only. 데이터 변경은 다음 일일 검증 배포에 반영.
# 또는 수동 트리거 (Actions 탭 → Run workflow)
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install imagehash pillow

      - name: Detect & sync new OnePiece series
        run: python scripts/sync_onepiece.py

      - name: Stage intended data files and check changes
        id: changes
        run: |
          paths=(data/cards-by-set data/card-to-box.json images/onepiece scripts/fetch_onepiece_http.py)
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --cached --stat
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 OnePiece 신규 series 자동 동기화"
          git push
