name: Scrape SNKRDUNK Daily

on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # data/*.json 커밋 권한

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.20.0" "webdriver-manager>=4.0.0"

      - name: Run scraper
        run: python scripts/scrape_snkrdunk.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit JSON updates (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily SNKRDUNK scrape — auto-update"
          file_pattern: "data/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
