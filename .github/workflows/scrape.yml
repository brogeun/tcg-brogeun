name: Scrape SNKRDUNK Daily

on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:  # 수동 실행 버튼
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'         # data 자동 커밋이 무한 루프 트리거 방지
      - 'scripts/**'      # 스크립트 변경은 다음 cron 까지 대기
      - '**/*.md'         # README 등 문서 변경은 배포 불필요

permissions:
  contents: write  # data/*.json 커밋 권한

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome browser
        if: github.event_name != 'push'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.20.0" "webdriver-manager>=4.0.0"

      - name: Run scraper
        if: github.event_name != 'push'
        run: python scripts/scrape_snkrdunk.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run news scraper (한국 TCG 뉴스 - 4·5월)
        if: github.event_name != 'push'
        run: python scripts/scrape_news.py || echo "news scrape failed (non-fatal)"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit JSON updates (if any)
        if: github.event_name != 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily SNKRDUNK scrape — auto-update"
          file_pattern: "data/*.json data/history/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare deploy bundle (정적 + admin function 만)
        # 옛날 functions/api/*.js 들은 deploy 깨뜨려서 제외, admin.js 만 포함
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp -r index.html _redirects data _deploy/ 2>/dev/null || true
          # 추가 정적 파일들 (있을 때만 복사)
          for f in mobile.html manifest.json sw.js favicon.ico robots.txt privacy.html terms.html; do
            [ -f "$f" ] && cp "$f" _deploy/ || true
          done
          for d in assets images img public static ev-calculator; do
            [ -d "$d" ] && cp -r "$d" _deploy/ || true
          done
          # functions 배포 — admin + auth + portfolio (명시적 화이트리스트)
          mkdir -p _deploy/functions/api/auth
          mkdir -p _deploy/functions/api/portfolio/holding
          mkdir -p _deploy/functions/api/portfolio/watchlist
          mkdir -p _deploy/functions/_shared
          # 공유 헬퍼
          for f in jwt.js email.js auth.js; do
            [ -f "functions/_shared/$f" ] && cp "functions/_shared/$f" "_deploy/functions/_shared/$f" && echo "✓ _shared/$f"
          done
          # admin
          [ -f functions/api/admin.js ] && cp functions/api/admin.js _deploy/functions/api/admin.js && echo "✓ admin"
          # auth
          for f in request.js verify.js me.js logout.js; do
            [ -f "functions/api/auth/$f" ] && cp "functions/api/auth/$f" "_deploy/functions/api/auth/$f" && echo "✓ auth/$f"
          done
          # portfolio
          [ -f functions/api/portfolio/index.js ] && cp functions/api/portfolio/index.js _deploy/functions/api/portfolio/index.js && echo "✓ portfolio/"
          [ -f functions/api/portfolio/holding.js ] && cp functions/api/portfolio/holding.js _deploy/functions/api/portfolio/holding.js && echo "✓ portfolio/holding"
          [ -f functions/api/portfolio/holding/[id].js ] && cp "functions/api/portfolio/holding/[id].js" "_deploy/functions/api/portfolio/holding/[id].js" && echo "✓ portfolio/holding/[id]"
          [ -f functions/api/portfolio/transaction.js ] && cp functions/api/portfolio/transaction.js _deploy/functions/api/portfolio/transaction.js && echo "✓ portfolio/transaction"
          [ -f functions/api/portfolio/watchlist.js ] && cp functions/api/portfolio/watchlist.js _deploy/functions/api/portfolio/watchlist.js && echo "✓ portfolio/watchlist"
          [ -f functions/api/portfolio/watchlist/[id].js ] && cp "functions/api/portfolio/watchlist/[id].js" "_deploy/functions/api/portfolio/watchlist/[id].js" && echo "✓ portfolio/watchlist/[id]"
          echo "=== _deploy 디렉토리 구조 ==="
          find _deploy -type f | head -30
          echo "=== data/ 파일 수 ==="
          ls _deploy/data/ 2>/dev/null | wc -l

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=tcghubrogeun --branch=main --commit-dirty=true
