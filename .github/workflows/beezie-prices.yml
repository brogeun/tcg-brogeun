name: Beezie EV prices

# 10분 간격 cron — Beezie 현재 공식 목록·운영 상태·가격 확인
# (메인 브랜치 안 건드림 → Cloudflare Pages 빌드 트리거 X)
# 활성 머신만 공식 화면의 평균값까지 확인합니다.

on:
  schedule:
    - cron: '7-57/10 * * * *'  # 10-minute targets outside the busy hour boundary.
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: beezie-prices
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (main 만, scripts 가져오려고)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate current catalogue, unavailable sources and manual-input preservation
        run: |
          python -m unittest discover -s scripts -p test_fetch_beezie.py
          node --test scripts/test_beezie_availability_ui.cjs

      # 활성 머신은 API(price) + 공식 렌더 화면(avg)을 함께 확인합니다.
      - name: Install Playwright + chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch Beezie prices
        run: python scripts/fetch_beezie.py

      - name: Verify fresh and complete output before publishing
        run: python scripts/verify_beezie_snapshot.py --path data/beezie-prices.json

      - name: Commit to data-beezie branch (orphan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 임시 디렉토리에 결과 파일만 백업
          mkdir -p /tmp/beezie-out
          cp data/beezie-prices.json /tmp/beezie-out/beezie-prices.json

          # data-beezie 브랜치 새로 만들고 (또는 reset) 결과 파일만 push
          git checkout --orphan data-beezie
          git rm -rf . --quiet 2>/dev/null || true
          mkdir -p data
          cp /tmp/beezie-out/beezie-prices.json data/beezie-prices.json
          git add data/beezie-prices.json
          git commit -m "data: beezie prices ${{ github.run_number }} ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))" --allow-empty
          git push origin data-beezie --force
