name: Verify card pricing integration

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test_price_box_names.mjs'
      - 'scripts/build_search_snapshot.cjs'
      - 'scripts/test_search_snapshot.cjs'
      - 'data/manual-boxes-*.json'
      - 'data/price-*.json'
      - 'data/cards-meta-index.json'
      - 'sw.js'
      - 'assets/**'
      - 'scripts/helpers/**'
      - 'scripts/test_card_info_pricing_integration.cjs'
      - 'scripts/test_cardinfo_list_budget.cjs'
      - 'scripts/test_verify_card_info_prices.cjs'
      - 'scripts/test_contained_artwork_data.cjs'
      - 'scripts/audit/catalogue-repairs.test.cjs'
      - 'scripts/verify_card_info_prices_production.cjs'
      - 'scripts/test_futuristic_market.mjs'
      - 'scripts/sync_futuristic_market.py'
      - 'scripts/backfill_history.py'
      - 'data/all-cards.json'
      - 'data/card-catalog-repairs.json'
      - 'data/contained-card-market-links.json'
      - 'data/pokemon-reviewed-fallback-links.json'
      - 'data/onepiece-card-overrides.json'
      - 'data/futuristic-market.json'
      - 'data/anniversary-market.json'
      - 'data/history/881432.json'
      - 'data/history/881433.json'
      - 'data/history/897035.json'
      - 'data/history/897036.json'
      - 'data/cards-by-set/**'
      - 'config/registered-box-market-links.json'
      - 'config/verified-image-url-repairs.json'
      - 'scripts/apply_verified_image_repairs.py'
      - 'scripts/test_verified_image_repairs.py'
      - 'scripts/reviewed_market_card_images.py'
      - 'scripts/test_reviewed_market_card_images.py'
      - 'config/reviewed-market-card-images.json'
      - 'data/tcg-card-info/**'
      - 'data/snkrdunk-games/**'
      - 'scripts/build_tcg_card_info.py'
      - 'scripts/collect_snkrdunk_games.py'
      - 'data/japanese-catalog.json'
      - 'config/english-trainer-kit-packages.json'
      - 'scripts/collect_us_market.py'
      - 'scripts/test_shared_trainer_kits.py'
      - 'scripts/test_unresolved_box_reviews.cjs'
      - 'scripts/test_contained_market_versions.cjs'
      - 'scripts/verify_contained_market_versions.cjs'
      - 'scripts/test_remaining_market_links.cjs'
      - 'scripts/verify_reviewed_pokemon_fallbacks.cjs'
      - '.github/workflows/pricing-integration-ci.yml'
      - '.github/workflows/scrape.yml'
      - '.github/workflows/market-references-daily.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /data/price-box-name-overrides.json
            /data/cards-meta-index.json
            /data/cards-meta.json
            /data/japanese-card-names-ko.json
            /data/search-aliases.json
            /data/pokemon-vintage-image-repairs.json
            /data/manual-boxes-pokemon.json
            /data/manual-boxes-onepiece.json
            /data/price-pokemon-box.json
            /data/price-onepiece-box.json
            /data/price-pokemon-card.json
            /data/price-onepiece-card.json
            /sw.js
            /assets/
            /scripts/
            /data/all-cards.json
            /data/cards-detail.json
            /data/card-catalog-repairs.json
            /data/contained-card-market-links.json
            /data/pokemon-reviewed-fallback-links.json
            /data/yuyutei-market/pokemon.json
            /data/onepiece-card-overrides.json
            /data/futuristic-market.json
            /data/anniversary-market.json
            /data/history/881432.json
            /data/history/881433.json
            /data/history/897035.json
            /data/history/897036.json
            /data/cards-by-set/
            /config/
            /data/english-catalog.json
            /data/japanese-catalog.json
            /images/onepiece/OP17-DON-*.webp
            /images/pokemon/tcgcollector-*.webp
            /images/pokemon-vintage/L3/tcg-26021.webp
            /images/pokemon-vintage/L2/tcg-26093.webp
            /images/pokemon-vintage/Pt3/tcg-26543.webp
            /images/pokemon-vintage/DP6/tcg-26832.webp
            /data/tcg-card-info.json
            /data/tcg-card-info/yugioh/e6a43433954cfbf9.json
            /data/tcg-card-info/yugioh/11f0dd1b569bc58a.json
            /data/tcg-card-info/weiss_schwarz/cfb041b5d62e675d.json
            /data/snkrdunk-games/weiss_schwarz-card-0106.json
            /data/snkrdunk-games/yugioh-card-0006.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check card clicks and exact deployed asset URLs
        run: |
          node --test scripts/test_cardinfo_list_budget.cjs
          python scripts/apply_verified_image_repairs.py --root . --verify-only
          python -m unittest scripts.test_verified_image_repairs
          python scripts/reviewed_market_card_images.py --root . --verify-only
          python -m unittest scripts.test_reviewed_market_card_images
          node --test --test-concurrency=1 scripts/test_card_info_pricing_integration.cjs
          node --test --test-concurrency=1 scripts/test_verify_card_info_prices.cjs
          node --test scripts/test_contained_artwork_data.cjs
          node --test scripts/audit/catalogue-repairs.test.cjs
          node scripts/test_futuristic_market.mjs
          node scripts/test_price_box_names.mjs
          node --test --test-concurrency=1 scripts/test_search_snapshot.cjs
          node --test --test-concurrency=1 scripts/test_unresolved_box_reviews.cjs scripts/test_english_set_images.cjs scripts/test_contained_artwork_bindings.cjs
          node --test scripts/test_contained_market_versions.cjs
          node scripts/verify_contained_market_versions.cjs
          node --test scripts/test_remaining_market_links.cjs
          node scripts/verify_reviewed_pokemon_fallbacks.cjs
          python -m unittest scripts.test_collect_us_market scripts.test_shared_trainer_kits
          python scripts/test_refresh_registered_box_quotes.py
