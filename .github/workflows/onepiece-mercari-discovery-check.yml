name: Verify One Piece Mercari discovery
on:
  push:
    branches: ['onepiece/mercari-discovery-20261101']
    paths:
      - 'scripts/onepiece_audit/discover_mercari.py'
      - 'scripts/onepiece_audit/test_discovery.py'
      - '.github/workflows/onepiece-mercari-discovery-check.yml'
      - '.github/workflows/market-references-daily.yml'
      - 'scripts/onepiece_audit/browser_discovery.py'
      - 'data/onepiece-mercari-discovery-seeds.json'
permissions:
  contents: write
concurrency:
  group: onepiece-mercari-discovery-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onepiece/mercari-discovery-20261101
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source circuits, retained observations and workflow budgets
        run: |
          python scripts/onepiece_audit/test_discovery.py
          python scripts/test_collect_mercari_references.py
          python scripts/test_market_references_workflow.py
      - name: Install standard public browser
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: Discover only original public listing links
        id: discovery
        continue-on-error: true
        run: python scripts/onepiece_audit/discover_mercari.py --render
      - name: Observe discovered listing metadata without assigning canonical prices
        if: steps.discovery.outcome == 'success'
        run: |
          python scripts/collect_mercari_references.py --watchlist .cache/onepiece-mercari-watchlist.json --output .cache/onepiece-mercari-fresh.json --max-items 20 --timeout 20
          python scripts/onepiece_audit/discover_mercari.py --merge
      - name: Validate reference semantics and retain source failures honestly
        run: |
          python scripts/validate_reference_markets.py --root . --output .cache/onepiece-reference-check.json
          git diff --check
      - name: Save source observations on isolated branch only
        run: |
          test "$(git branch --show-current)" = "onepiece/mercari-discovery-20261101"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onepiece-mercari-discovery.json data/mercari-references.json
          if ! git diff --cached --quiet; then
            git commit -m "Record bounded One Piece Mercari discovery observations"
            git push origin HEAD:refs/heads/onepiece/mercari-discovery-20261101
          fi
