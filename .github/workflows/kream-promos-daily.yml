name: KREAM Korean Promos Daily

on:
  # Cloud source navigation failed even in ordinary installed browsers.
  # Owner-PC scheduled collection uses KREAM Local Publish; cloud is manual only.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kream-korean-promos
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record collection source
        run: echo "KREAM_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate original full histories and duplicate preservation
        run: |
          python -m unittest scripts.test_kream_promos scripts.test_setup_kream_session scripts.test_kream_session_storage
          python scripts/collect_kream_promos.py --validate-only
      - name: Check owner session and daily freshness
        id: preflight
        continue-on-error: true
        env:
          KREAM_STORAGE_STATE: ${{ secrets.KREAM_STORAGE_STATE }}
          KREAM_EVENT: ${{ github.event_name }}
        run: |
          if [ "$KREAM_EVENT" = schedule ]; then
            python scripts/collect_kream_promos.py --preflight --scheduled
          else
            python scripts/collect_kream_promos.py --preflight
          fi
      - name: Install rendered-page collector
        id: browser-install
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.needed == 'true'
        continue-on-error: true
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Collect all seven KREAM trade histories
        id: collect
        if: steps.browser-install.outcome == 'success'
        continue-on-error: true
        env:
          KREAM_STORAGE_STATE: ${{ secrets.KREAM_STORAGE_STATE }}
        run: python scripts/collect_kream_promos.py
      - name: Record browser setup failure without changing trade data
        if: steps.browser-install.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          m=json.loads(Path('data/korean-promos.json').read_bytes())
          health={'schemaVersion':1,'status':'failed','reason':'browser_setup_failed','last_attempt_at':datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),'last_success_at':m['last_success_at']}
          Path('data/korean-promos-health.json').write_text(json.dumps(health,separators=(',',':'))+'\n')
          PY
      - name: Publish validated generation or failure health while retaining prior trades
        if: steps.preflight.outputs.needed != 'false'
        run: python scripts/publish_data_snapshot.py --files data/korean-promos.json --base "$KREAM_BASE" --message 'Refresh Korean promo KREAM trade histories'
      - name: Report source access failure
        if: steps.preflight.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.browser-install.outcome == 'failure'
        run: |
          echo 'KREAM collection did not succeed. Prior prices and charts are preserved; inspect data/korean-promos-health.json.'
          exit 1


