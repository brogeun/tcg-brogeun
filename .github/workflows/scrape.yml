name: Scrape SNKRDUNK Daily

on:
  schedule:
    # 04:00 KST = 19:00 UTC (전날)
    - cron: '0 19 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # data/*.json 커밋 권한

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "selenium>=4.20.0" "webdriver-manager>=4.0.0"

      - name: Run scraper
        run: python scripts/scrape_snkrdunk.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit JSON updates (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Daily SNKRDUNK scrape — auto-update"
          file_pattern: "data/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare deploy bundle (정적 파일만)
        # functions/ 폴더는 사용 안 하므로 배포 디렉토리에서 제외 — 'Failed to publish your Function' 에러 회피
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp -r index.html _redirects data _deploy/ 2>/dev/null || true
          # 추가 정적 파일들 (있을 때만 복사)
          for f in mobile.html manifest.json sw.js favicon.ico robots.txt; do
            [ -f "$f" ] && cp "$f" _deploy/ || true
          done
          for d in assets images img public static ev-calculator; do
            [ -d "$d" ] && cp -r "$d" _deploy/ || true
          done
          echo "=== _deploy 디렉토리 구조 ==="
          ls -la _deploy/
          echo "=== data/ 파일 수 ==="
          ls _deploy/data/ 2>/dev/null | wc -l

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=tcghubrogeun --branch=main --commit-dirty=true
