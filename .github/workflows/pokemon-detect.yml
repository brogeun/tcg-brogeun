name: Pokemon New Set Auto-Sync

# Single daily cycle: Monday only — 신규 세트 후보 감지.
# 실제 데이터 변경은 다음 일일 수집 워크플로우의 검증된 배포에 반영.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 imagehash pillow

      - name: Detect new Pokemon set candidates
        id: sync
        run: |
          python scripts/sync_pokemon.py 2>&1 | tee "$RUNNER_TEMP/pokemon-sync-output.txt"
          if grep -q "🆕 신규 후보\|✓ 신규 세트 fetch" "$RUNNER_TEMP/pokemon-sync-output.txt"; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Build card-to-box reverse map (Pokemon 신규 반영)
        if: steps.sync.outputs.has_new == 'true'
        run: python scripts/build_card_to_box.py

      - name: Stage intended data files and check changes
        id: changes
        run: |
          paths=(data/cards-by-set data/card-to-box.json images/sets index.html)
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -- "$path"
            fi
          done
          if ! git diff --cached --quiet; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --cached --stat
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 Pokemon 신규 세트 자동 동기화"
          git push

      - name: Create issue if sync failed
        if: failure() && steps.sync.outputs.has_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(`${process.env.RUNNER_TEMP}/pokemon-sync-output.txt`, 'utf8');
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Pokemon 자동 동기화 실패 (${today})`,
              body: `자동 fetch 또는 commit 실패. 로그:\n\n\`\`\`\n${output.slice(0, 5000)}\n\`\`\``,
              labels: ['auto-detect', 'failed'],
            });
