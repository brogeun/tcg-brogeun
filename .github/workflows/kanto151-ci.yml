name: KANTO151 Gameplay Regressions

on:
  pull_request:
    paths:
      - 'games/kanto151/**'
      - 'scripts/test_kanto*.mjs'
      - 'functions/**/kanto151-save.js'
      - '.github/workflows/kanto151-ci.yml'
  push:
    branches: [main]
    paths:
      - 'games/kanto151/**'
      - 'scripts/test_kanto*.mjs'
      - 'functions/**/kanto151-save.js'
      - '.github/workflows/kanto151-ci.yml'

permissions:
  contents: read

jobs:
  gameplay-and-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify gameplay, capture and save compatibility
        run: node --test scripts/test_kanto*.mjs games/kanto151/scripts/*.test.mjs
