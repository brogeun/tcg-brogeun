name: History Full Rotate

# 전체 카드 거래량을 매일 1/7씩 순환 → 주간 전체 1바퀴.
# collect_card_ids() 가 인기/신상만 모으는 한계를 보완 (롱테일 ~6,600장 커버).
on:
  schedule:
    - cron: '0 15 * * *'   # 00:00 KST 매일 (scrape.yml 19 UTC 와 시간 분리)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape            # scrape.yml 과 같은 그룹 → 동시 실행 방지
  cancel-in-progress: false
  queue: max

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Record the source actually checked out after waiting in the queue
        run: echo "COLLECTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify history failure preservation and concurrent publication
        run: |
          python -B -m unittest discover -s scripts -p test_backfill_card_history_safety.py
          python -B -m unittest discover -s scripts -p test_publish_data_snapshot.py

      - name: Compute batch index (day-of-year mod 7)
        id: b
        run: echo "n=$(( $(date +%j) % 7 ))" >> "$GITHUB_OUTPUT"

      - name: Backfill 1/7 of all cards (last 40 days volume)
        id: collect
        continue-on-error: true
        run: python scripts/backfill_card_history.py --batch ${{ steps.b.outputs.n }} --of 7 --days 40
        env:
          PYTHONUNBUFFERED: "1"

      - name: Publish completed histories while preserving concurrent changes
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        run: |
          python -B - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish_data_snapshot import PublicationError, daily_files, publish
          root = Path.cwd().resolve()
          base = os.environ['COLLECTION_COMMIT']
          files = daily_files(root, base)
          if any(not re.fullmatch(r'data/history/[1-9][0-9]{0,19}\.json', name) for name in files):
              raise PublicationError('History rotate may publish only generated history JSON')
          print(json.dumps(publish(root, base, files,
              'data: refresh completed history rotation targets', daily=True)))
          PY

      - name: Report incomplete collection after retaining completed histories
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo '::error::History collection was incomplete. Failed cards retained their prior bytes and dates; completed independent histories were offered for guarded publication.'
          exit 1
