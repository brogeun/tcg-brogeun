<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Angular / origami-style P mark -->
  <g fill="#ffffff">
    <!-- Vertical spine -->
    <polygon points="8,8 8,72 24,72 24,44 24,8"/>
    <!-- Top horizontal bar (angular) -->
    <polygon points="8,8 52,8 60,16 24,16 24,8"/>
    <!-- Right slanted edge -->
    <polygon points="52,8 68,24 68,36 60,44 60,28 52,20"/>
    <!-- Bowl closing bar -->
    <polygon points="24,36 60,36 52,44 24,44"/>
    <!-- Inner facet accent (lighter) -->
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <polygon points="24,16 52,16 60,24 60,28 52,20 24,20"/>
    <polygon points="24,40 52,40 60,36 60,40 52,44 24,44"/>
  </g>

  <!-- Wordmark: phygitals -->
  <g fill="#ffffff" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="46" letter-spacing="-1.5">
    <text x="92" y="54">phygitals</text>
  </g>
</svg>
