name: Verify box and set artwork

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'assets/english-catalog.*'
      - 'assets/japanese-catalog.js'
      - 'assets/japanese-set-artwork.js'
      - 'assets/app-route-loader.js'
      - 'config/*set-image*'
      - 'config/pokemon-tcg-english-sets.json'
      - 'config/japanese-packaging-images.json'
      - 'data/english-set-images.json'
      - 'scripts/*set*images*'
      - 'scripts/*set*artwork*'
      - 'scripts/retailer_card_printings.py'
      - 'scripts/test_retailer_printing_covers.py'
      - 'scripts/materialize_vintage_pokemon_release.py'
      - 'scripts/test_materialize_vintage_pokemon_release.py'
      - '.github/workflows/box-artwork-ci.yml'

permissions:
  contents: read

concurrency:
  group: box-artwork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /assets/
            /scripts/
            /config/
            /data/english-catalog.json
            /data/english-set-images.json
            /data/us-market/
            /images/box/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned image verifier
        run: python -m pip install "Pillow==12.2.0"
      - name: Verify provenance, exact identities and source request pacing
        run: |
          node --test scripts/test_english_set_images.cjs scripts/test_japanese_set_artwork.cjs scripts/test_set_artwork_release.cjs
          python -B -m unittest discover -s scripts -p test_retailer_printing_covers.py
          python -B -m unittest discover -s scripts -p test_materialize_vintage_pokemon_release.py
